name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: powershell
        run: .\build.ps1
      - name: Self-test
        shell: powershell
        run: |
          $process = Start-Process .\dist\QuickLauncher.exe -ArgumentList '--self-test' -Wait -PassThru
          Get-Content .\tests\work\result.txt
          if ($process.ExitCode -ne 0) { throw 'Self-test failed.' }
      - name: Locate Inno Setup compiler
        shell: powershell
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Compiler missing.' }
          "INNO_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Package installer and portable edition
        shell: powershell
        run: .\package-windows.ps1 -InnoCompiler $env:INNO_COMPILER
      - name: Installer smoke-test
        shell: powershell
        run: .\tests\Test-Installer.ps1
      - name: Updater integration tests
        shell: powershell
        run: .\tests\Test-Updater.ps1
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and VERSION do not match.' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/release/*-windows-setup.exe
            dist/release/*-windows-portable.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*-windows-setup.exe release/*-windows-portable.zip --verify-tag --title "QuickLauncher $GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md
